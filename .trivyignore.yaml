# Trivy findings that are real but not actionable here, with the reason written down.
# Reviewed 2026-09-01.
secrets:
  - id: private-key
    paths:
      - "etc/ssl/private/ssl-cert-snakeoil.key"
      - "/etc/ssl/private/ssl-cert-snakeoil.key"
    statement: >-
      Snakeoil key generated by the ssl-cert postinst during the base image build,
      inherited from ghcr.io/euro-office/documentserver. This wrapper installs no
      packages and creates no keys. ssl-cert is a hard dependency of
      postgresql-common, and the key is only reachable by the container's own
      loopback Postgres (DB_HOST defaults to localhost, 5432 is never published).
      nginx never uses it: the upstream entrypoint writes an SSL vhost only when
      SSL_CERTIFICATE_PATH and SSL_KEY_PATH are both set and both files exist.
      Deleting the file is NOT the fix - pg_createcluster points ssl_key_file at
      it, so removing it would stop Postgres starting.
