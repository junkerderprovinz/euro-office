; Extra supervisor program (see chown-heal.sh for why). priority=1 makes
; supervisord start this before the vendor's own ds-* programs (higher
; priority numbers), which need Data/ writable by the `ds` user from the
; moment they start.
[program:chown-heal]
command=/usr/local/bin/chown-heal.sh
priority=1
autostart=true
autorestart=false
startsecs=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
