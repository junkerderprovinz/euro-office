name: Build & Push

# Builds the Euro Office Unraid wrapper image and pushes to:
#   * GitHub Container Registry  (ghcr.io/junkerderprovinz/euro-office)
#   * Docker Hub                 (docker.io/<DOCKERHUB_USERNAME>/euro-office),
#     once the DOCKERHUB_USERNAME variable and the DOCKERHUB_TOKEN secret are
#     both set; until then the build stays GHCR-only.
#
# Single channel, tracking upstream's floating :latest tag (ARG BASE= in the
# Dockerfile) without a version pin. The weekly cron rebuild resolves whatever
# :latest points to and publishes it under the newest release's tags and latest.
#
# Architecture: one native build job per platform, amd64 on ubuntu-latest and
# arm64 on ubuntu-24.04-arm (free for public repos). Each job boots its image as
# a smoke gate (/hosting/discovery answers and a bind-mounted Data belongs to
# ds) and pushes by digest; a merge job then assembles the multi-arch manifest
# for both registries.
#
# Triggers:
#   * Push to main           -> edge, sha-<short>
#   * Tag v*.*.*              -> <version>, <major>.<minor>, <major>, and latest on
#     the newest tag
#   * Weekly cron (Sun 04 UTC) and manual workflow_dispatch -> the newest
#     release rebuilt without the layer cache under its version tags and latest,
#     which picks up upstream Euro Office and Ubuntu updates

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:

env:
  IMAGE_NAME: euro-office

jobs:
  # Rebuilds refresh the newest release, which is what people run, not the
  # tip of main.
  release:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.newest.outputs.tag }}
      sha: ${{ steps.newest.outputs.sha }}
    steps:
      - name: Find the newest release
        id: newest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view -R "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          echo "rebuilding $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)" >> "$GITHUB_OUTPUT"

  build:
    needs: release
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: true
      matrix:
        arch: [ amd64, arm64 ]
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          # A rebuild of the newest release describes that release, not main.
          labels: |
            ${{ needs.release.outputs.tag != '' && format('org.opencontainers.image.version={0}', needs.release.outputs.tag) || '' }}
            ${{ needs.release.outputs.tag != '' && format('org.opencontainers.image.revision={0}', needs.release.outputs.sha) || '' }}

      - name: Build ${{ matrix.arch }} image for smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: euro-office:smoke-${{ matrix.arch }}
          cache-from: type=gha,scope=build-${{ matrix.arch }}
          no-cache: ${{ needs.release.outputs.tag != '' }}

      # Smoke gate: the wrapper's files are present and executable, the container
      # boots through auto-tls.sh and Euro Office's WOPI discovery endpoint
      # answers. Data is bind-mounted from a runner folder, as Unraid mounts it
      # from appdata, and the services running as ds only work if the vendor
      # entrypoint hands that folder over to them (euro-office/documentserver#335).
      - name: "Smoke test: ${{ matrix.arch }} must answer WOPI discovery with Data owned by ds"
        run: |
          set -euo pipefail
          img=euro-office:smoke-${{ matrix.arch }}

          echo "== presence gate =="
          docker run --rm --entrypoint /bin/sh "$img" -c '
            set -e
            test -x /usr/local/bin/auto-tls.sh || { echo "auto-tls.sh not executable"; exit 1; }
            test -x /usr/local/bin/print-banner.sh || { echo "print-banner.sh not executable"; exit 1; }
            id ds
          '

          echo "== boot gate =="
          name=eo-smoke-${{ matrix.arch }}
          data="$(mktemp -d)"
          docker rm -f "$name" >/dev/null 2>&1 || true
          docker run -d --name "$name" \
            -v "$data:/var/www/euro-office/Data" \
            -e WOPI_ENABLED=true \
            -e JWT_ENABLED=true \
            -e JWT_SECRET=smoketest-secret \
            "$img"

          ok=0
          deadline=$((SECONDS + 180))
          while [ "$SECONDS" -lt "$deadline" ]; do
            if docker exec "$name" curl -fsS -o /dev/null http://localhost/hosting/discovery 2>/dev/null; then
              echo "discovery answered after ${SECONDS}s, checking the banner and Data ownership..."
              owner="$(docker exec "$name" stat -c '%U:%G' /var/www/euro-office/Data)"
              echo "Data owner: ${owner}"
              logs="$(docker logs "$name" 2>&1)"
              if ! grep -q 'Euro Office wrapper' <<< "$logs"; then
                echo "the wrapper banner is missing, auto-tls.sh did not run"
              elif [ "$owner" != "ds:ds" ]; then
                echo "Data is not owned by ds:ds"
              else
                ok=1
              fi
              break
            fi
            if [ -z "$(docker ps -q --filter name="$name")" ]; then
              echo "container exited early:"; break
            fi
            sleep 3
          done

          echo "== last logs =="
          docker logs "$name" 2>&1 | tail -60 || true
          docker rm -f "$name" >/dev/null 2>&1 || true
          [ "$ok" = "1" ] || { echo "smoke failed"; exit 1; }
          echo "smoke passed"

      # CVE scan of the locally loaded smoke image. Report-only (exit-code 0), so a
      # finding never blocks the build; results land in the repo Security tab.
      - name: Scan image for CVEs (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: euro-office:smoke-${{ matrix.arch }}
          format: sarif
          output: trivy-${{ matrix.arch }}.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          exit-code: "0"

      - name: Upload Trivy results to the Security tab
        if: ${{ github.event_name != 'pull_request' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: trivy-${{ matrix.arch }}.sarif
          category: trivy-${{ matrix.arch }}

      # Push this arch by digest without tags; the merge job assembles the
      # multi-arch manifest under the final tags.
      - name: Push ${{ matrix.arch }} by digest
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=build-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.arch }}
          no-cache: ${{ needs.release.outputs.tag != '' }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.push.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [ release, build ]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub mirror, active only once DOCKERHUB_USERNAME (variable) and
      # DOCKERHUB_TOKEN (secret) are both set; skipped otherwise.
      - name: Login to Docker Hub
        if: ${{ vars.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # latest moves only for the newest tag, so re-cutting an older version cannot
      # drag it backwards. This job never checks the repo out, so the tags come straight
      # from the remote.
      - name: Is this the newest release tag?
        id: newest
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          newest=$(git ls-remote --tags --refs \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" 'v*.*.*' \
            | sed 's#.*refs/tags/##' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          echo "this tag: ${GITHUB_REF_NAME}"
          echo "newest:   ${newest}"
          if [ "$newest" = "${GITHUB_REF_NAME}" ]; then
            echo "is_newest=true" >> "$GITHUB_OUTPUT"
            echo "-> this build moves :latest"
          else
            echo "is_newest=false" >> "$GITHUB_OUTPUT"
            echo "-> this build leaves :latest where it is"
          fi

      - name: Extract metadata (tags)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
            name=docker.io/${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }},enable=${{ vars.DOCKERHUB_USERNAME != '' }}
          # The action adds latest to every semver tag unless the flavor turns that off.
          flavor: |
            latest=false
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' && needs.release.outputs.tag == '' }}
            type=raw,value=latest,enable=${{ (github.ref_type == 'tag' && steps.newest.outputs.is_newest == 'true') || needs.release.outputs.tag != '' }}
            type=semver,pattern={{version}},value=${{ needs.release.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.tag }}
            type=semver,pattern={{major}},value=${{ needs.release.outputs.tag }}
            type=sha,format=short,enable=${{ needs.release.outputs.tag == '' }}

      # Assemble the multi-arch manifest for every tag (both registries) from the
      # per-arch digests pushed to GHCR. imagetools copies platform images across
      # registries where needed (the Docker Hub tags).
      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          src="ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}"
          sources=""
          for d in *; do sources="$sources ${src}@sha256:${d}"; done
          echo "sources:${sources}"
          tagargs=""
          while IFS= read -r tag; do
            [ -n "$tag" ] && tagargs="$tagargs -t $tag"
          done <<< "$DOCKER_METADATA_OUTPUT_TAGS"
          echo "tags:${tagargs}"
          # Cross-registry copy (GHCR -> Docker Hub) can hit a transient HTTP/2
          # PROTOCOL_ERROR; retry a few times before failing.
          n=0
          until docker buildx imagetools create ${tagargs} ${sources}; do
            n=$((n + 1))
            if [ "$n" -ge 4 ]; then echo "imagetools create failed after $n attempts"; exit 1; fi
            echo "imagetools create failed (attempt $n); retrying in $((n * 15))s..."
            sleep $((n * 15))
          done

      - name: Inspect
        run: |
          docker buildx imagetools inspect ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}

  # Mirror the GitHub README to the Docker Hub repo description, once the
  # manifest exists. Skipped until DOCKERHUB_TOKEN is set.
  dockerhub-description:
    needs: merge
    if: ${{ !failure() && !cancelled() && vars.DOCKERHUB_USERNAME != '' && github.event_name != 'pull_request' }}
    # A cosmetic sync; a refused credential here must not fail the published image.
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (README for Docker Hub sync)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Docker Hub description sync ready?
        id: dhdesc
        env:
          PW: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$PW" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "DOCKERHUB_TOKEN not set, skipping Docker Hub description sync"; echo "go=false" >> "$GITHUB_OUTPUT"; fi

      - name: Sync README to Docker Hub
        if: ${{ steps.dhdesc.outputs.go == 'true' }}
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          short-description: "One-click Euro Office document server for Unraid, ready for OpenCloud, Nextcloud and ownCloud."
          enable-url-completion: true
