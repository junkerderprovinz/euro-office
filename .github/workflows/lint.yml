name: Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  hadolint:
    name: Hadolint (Dockerfile)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          # DL3006 (unpinned FROM) is expected: ARG BASE=...:latest tracks
          # upstream's floating tag (see the Dockerfile comment).
          failure-threshold: warning

  shellcheck:
    name: ShellCheck (wrapper scripts)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run shellcheck
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y shellcheck
          SCRIPTS="chown-heal.sh print-banner.sh"
          echo "Checking: ${SCRIPTS}"
          # -S warning: fail on warnings and up
          shellcheck -S warning ${SCRIPTS}
          echo "All scripts passed shellcheck."

  xml-validate:
    name: XML Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate XML files
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y libxml2-utils
          # The CA template lives in unraid-apps; this validates any XML added here.
          for f in $(find . -name '*.xml' -not -path './.git/*'); do
            echo "Checking $f"
            xmllint --noout "$f"
          done
